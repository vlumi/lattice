# Coverage tracks the testable game logic, not the SwiftUI view layer (which
# needs UI automation this project doesn't run). The two are split by Swift
# target: LatticeCore is pure, headlessly-testable logic and is gated;
# LatticeKit is the SwiftUI board/views and is ignored wholesale. Keep logic
# in LatticeCore so it's covered automatically — no per-file edits here when
# a view file is added.

coverage:
  status:
    project:
      default:
        target: auto          # don't drop below the current project coverage
        threshold: 2%         # tolerate small fluctuations
    patch:
      default:
        target: 80%           # new (non-ignored) code must be ≥80% covered
        threshold: 0%         # no slack below the target

comment:
  # Only comment when coverage actually changed; keeps PRs quiet.
  require_changes: true

# The whole LatticeKit target is the view layer (the CI coverage export
# already excludes it; this keeps Codecov's own view consistent). Tests
# themselves aren't coverage subjects.
#
# CloudStore.swift is the one exception in LatticeCore: its only real
# executable code is `UbiquitousCloudStore`, a thin wrapper over
# `NSUbiquitousKeyValueStore` that can't run without a signed-in iCloud
# device. All the SYNC LOGIC — merge, self-heal, split-to-files — lives in
# `SyncCoordinator` / `SyncedState` / `LatticeStore` and is driven through
# the `CloudStore` protocol via `FakeCloudStore`, fully covered.
#
# Kept in sync with the CI export's -ignore-filename-regex in ci.yml — the
# two must agree.
ignore:
  - "Packages/LatticeCore/Sources/LatticeKit/**"
  - "Packages/LatticeCore/Sources/LatticeCore/Sync/CloudStore.swift"
  - "Packages/LatticeCore/Tests/**"
