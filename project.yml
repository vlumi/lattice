name: Lattice

options:
  bundleIdPrefix: fi.misaki
  deploymentTarget:
    iOS: "16.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  LatticeCore:
    path: Packages/LatticeCore

targets:
  Lattice-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/iOS
      - path: Sources/Shared
    info:
      path: Sources/iOS/Info.plist
      properties:
        CFBundleDisplayName: Lattice Five
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No encryption → declare it so every TestFlight/App Store upload skips
        # the export-compliance prompt.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.puzzle
        # System-default launch screen (plain background) — the board fades in.
        UILaunchScreen: {}
        # Camera is used only to scan a challenge QR (opt-in, from the scan
        # sheet). Never records or stores anything — the frame is discarded
        # after a code is read.
        NSCameraUsageDescription: Scan a challenge QR code to play a friend's board.
        # Nearby duel (MultipeerConnectivity/Bonjour): finds the other player's
        # open Nearby screen on the local network. Nothing leaves the room.
        NSLocalNetworkUsageDescription: Find a nearby player to duel directly.
        NSBonjourServices:
          - _lattice-duel._tcp
          - _lattice-duel._udp
        # All four orientations: a universal (iPhone + iPad) app must support
        # them for iPad multitasking, or App Store validation rejects the
        # build. The board is orientation-agnostic.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.misaki.lattice
        # User-visible app/bundle name; without this it'd be the target name
        # "Lattice-iOS".
        PRODUCT_NAME: Lattice Five
        MARKETING_VERSION: "0.5.0"
        # Build number is shared across iOS + macOS, bumped in lock-step by
        # the release lane so the apps never diverge.
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Universal Links (challenge codes) — associated-domains capability.
        CODE_SIGN_ENTITLEMENTS: Sources/iOS/Lattice.entitlements
        # Signing: the personal paid-account team, committed like Donpa's —
        # the .xcodeproj is regenerated (wiping Xcode-set values), and the
        # team ID is public anyway (it's in the site's AASA file).
        DEVELOPMENT_TEAM: U84DT7P75P
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: LatticeCore
        product: LatticeKit

  Lattice-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/macOS
      - path: Sources/Shared
    info:
      path: Sources/macOS/Info.plist
      properties:
        CFBundleDisplayName: Lattice Five
        CFBundleName: Lattice Five  # menu-bar app name (else PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # macOS uses a DIFFERENT category-UTI namespace than iOS: game
        # categories are suffixed "-games" (plain `…puzzle` is rejected at
        # Mac App Store validation).
        LSApplicationCategoryType: public.app-category.puzzle-games
        # Must track the deploymentTarget above — this explicit key OVERRIDES
        # the build-setting-derived minimum.
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        # Nearby duel — see the iOS target's note.
        NSLocalNetworkUsageDescription: Find a nearby player to duel directly.
        NSBonjourServices:
          - _lattice-duel._tcp
          - _lattice-duel._udp
    settings:
      base:
        # Shares the iOS bundle ID for Universal Purchase: one App Store
        # record spanning both platforms.
        PRODUCT_BUNDLE_IDENTIFIER: fi.misaki.lattice
        PRODUCT_NAME: Lattice Five
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "4"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        # Mac App Store requires App Sandbox; the entitlement enables it.
        CODE_SIGN_ENTITLEMENTS: Sources/macOS/Lattice.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: U84DT7P75P
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: LatticeCore
        product: LatticeKit
    # Explicit scheme so XcodeGen writes a SHARED scheme file — without it,
    # `xcodebuild -scheme Lattice-macOS` fails on a fresh checkout.
    scheme:
      configVariants: []
